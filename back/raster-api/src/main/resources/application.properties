server.port=8080
# --- 为何「亚马逊大影像能看、本地上传却提示体积过大」---
# STAC/哨兵等在云端多为 COG：TiTiler 只按瓦片发 Range 请求读对象存储，不经浏览器整包上传，也不占 Spring 的 multipart 配额。
# 本地上传是同一条 HTTP POST 把整个 GeoTIFF 打进后端再落盘，必须受下方 multipart / Tomcat 限制；超大文件还应考虑磁盘空间、JVM 堆、浏览器/反向代理超时。
# Tomcat 默认 max-swallow-size 过小会导致大 body 异常结束时浏览器 net::ERR_CONNECTION_RESET
server.tomcat.max-http-post-size=5GB
server.tomcat.max-swallow-size=-1
# 落盘为 UUID + 原扩展名（.tif/.tiff 等）；下载映射为 /file/** 避免 Spring 误剥扩展名。GDAL /vsicurl/ 需要 URL 上可见扩展名。
# 传给 TiTiler 的 COG 下载地址必须是「TiTiler 进程能访问到的」URL。
# TiTiler 若在 Docker 内，localhost:8080 指向容器自己而非宿主机 Spring → /cog/info 会报 CURL Could not connect to localhost:8080。
# Docker Desktop（Win/Mac）：用 host.docker.internal；Linux Docker：docker run 加 --add-host=host.docker.internal:host-gateway，或改用宿主机局域网 IP。
app.public-base-url=http://223.2.33.91:8080
# 仅 TiTiler 拉取 COG 时使用的基址（默认同 app.public-base-url）。502 且 TiTiler detail 含 404 时，可改为宿主机局域网 IP，例如：
# app.titiler-cog-base-url=http://192.168.1.100:8080
# Spring 与 TiTiler 都在本机、均非 Docker 时建议：app.public-base-url=http://127.0.0.1:8080
upload.raster-dir=E:/precision-observer-uploads
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=${java.io.tmpdir}/spring-multipart-work
spring.datasource.url=jdbc:postgresql://localhost:5432/gis_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
# 表结构由 Flyway 迁移（classpath:db/migration）在启动时自动执行
spring.flyway.enabled=true
# 库中已有历史表（如 raster_metadata）但尚无 flyway_schema_history 时，先 baseline 再执行高于 baseline 的脚本
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
geocode.nominatim-base-urls=https://nominatim.openstreetmap.org,https://nominatim.openstreetmap.fr
geocode.user-agent=precision-observer-raster-api/1.0
geocode.connect-timeout-ms=3000
geocode.request-timeout-ms=8000
live.amap.key=f79686bdd30b832b10fc34b3fb9a4274
live.amap.geocode-url=https://restapi.amap.com/v3/geocode/geo
live.amap.district-url=https://restapi.amap.com/v3/config/district
live.stac.search-url=https://earth-search.aws.element84.com/v1/search
live.http-timeout-ms=12000
live.titiler.base-url=http://localhost:8000
live.titiler.tile-size=512
# jpg 较 png 体积小，浏览器解码更快（需要无损可用 png）
live.titiler.tile-format=jpg
# 上传后 Spring 调 TiTiler /cog/info；超大扁平 GeoTIFF 首次打开可能很慢，应远大于 live.http-timeout-ms
upload.titiler-timeout-ms=600000
# 通义（DashScope OpenAI 兼容模式）：https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
# 切勿把真实 Key 写进仓库；启动前设置环境变量 LLM_API_KEY（或 JVM -Dllm.api-key=...）
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api-key=${LLM_API_KEY:}
llm.model=tongyi-intent-detect-v3
llm.timeout-ms=15000
analysis.cropland.zoom=10
analysis.cropland.ndvi-min=0.20
analysis.cropland.ndvi-max=0.65
# Roboflow Workspace Private API Key（须与 roboflow.inference-workspace 同属一个 workspace，否则会 401）
# 切勿提交仓库；可用环境变量 ROBOFLOW_API_KEY 覆盖
roboflow.api-key=${ROBOFLOW_API_KEY:}
# 自建 GPU 推理容器示例：docker run -d --gpus all -p 9001:9001 roboflow/roboflow-inference-server-gpu:latest
# 非空则调用 {base}/infer/{task}（无 Cloudflare）。也可用环境变量 ROBOFLOW_INFERENCE_BASE_URL（云机公网或同机 127.0.0.1:9001）
roboflow.inference-base-url=${ROBOFLOW_INFERENCE_BASE_URL:}
roboflow.inference-task=object_detection
# 格式 project_id/版本号（Roboflow 项目 → Deploy）。也可用 ROBOFLOW_MODEL_ID；请求 JSON 里 modelId 可覆盖
roboflow.inference-model-id=${ROBOFLOW_MODEL_ID:}
# 自建容器上跑 Roboflow Workflow：POST {inference-base-url}/infer/workflows/{workspace}/{workflow_id}
# 与 serverless 相同 body（api_key + inputs）。若 workspace + workflow-id 均非空，则优先走工作流，不要求 inference-model-id
roboflow.inference-workspace=${ROBOFLOW_INFERENCE_WORKSPACE:}
roboflow.inference-workflow-id=${ROBOFLOW_WORKFLOW_ID:}
# Workflow 请求体过大时 uvicorn/h11 可能报 400「Invalid HTTP request」；单独缩小预览边长（像素）
roboflow.workflow-preview-max-size=384
# true=仅使用旧路径 POST /infer/workflows/{ws}/{id}；false=优先 POST /{ws}/workflows/{id}（Inference 源码推荐）
roboflow.inference-workflow-legacy-path=false
roboflow.inference-confidence=0.4
roboflow.inference-iou-threshold=0.5
# 仅当 inference-base-url 为空时使用（易被 Cloudflare 403）
roboflow.workflow-url=https://serverless.roboflow.com/wyzs-workspace-mwh2e/workflows/1778471606854
# serverless 等长请求上限
roboflow.timeout-ms=300000
# 单次 GPU Inference POST 超时（秒级，勿与下面「总墙上限」混用）
roboflow.inference-request-timeout-ms=180000
# TiTiler 生成 workflow 预览图超时；过大 GeoTIFF 时可能接近此值
roboflow.titiler-preview-timeout-ms=90000
# Inference 503 重试总墙上限（毫秒）；容器重启后 workflow 冷启动可能 >7 分钟，可在 application-local 再加大
roboflow.inference-max-wall-ms=720000
# Inference 忙（503 model manager lock / 429）时自动退避重试；后端已串行排队，勿多 Tab 连点
roboflow.inference-retry-max=12
roboflow.inference-retry-base-delay-ms=3000
roboflow.inference-retry-delay-cap-ms=30000
# 单卡 GPU 时多请求并发易 503（model manager lock）；true=本 JVM 内对 Inference 的 httpClient.send 串行（退避在锁外）
roboflow.inference-serialize-requests=false
roboflow.preview-max-size=1536
roboflow.max-preview-bytes=16777216
# --- v2 智能体（Python FastAPI + LangGraph，Redis 任务状态）---
# PostgreSQL（JPA + Flyway，表 analysis_task 见 db/migration/V3__analysis_task.sql）
# spring.datasource.url=jdbc:postgresql://localhost:5432/gis_db
# spring.datasource.username=postgres
# spring.datasource.password=123456
# Redis：Python 写入键 agent:task:{id}，并 PUBLISH 到频道 task:{id}；Spring 模式订阅 task:*
agent.base-url=${AGENT_API_BASE_URL:http://127.0.0.1:8001}
agent.redis-key-prefix=agent:task:
agent.redis-pubsub-channel-prefix=task:
agent.redis-pubsub-pattern=task:*
agent.http-timeout-ms=30000
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=
# spring.data.redis.database=0
# WebSocket STOMP 端点：ws://localhost:8080/ws ，订阅 /topic/task/{taskId}
# 可选：本地 application-local.properties 覆盖 llm.api-key（文件已加入 .gitignore）
spring.config.import=optional:classpath:application-local.properties
