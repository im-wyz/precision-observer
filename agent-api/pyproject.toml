[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-observer-agent-api"
version = "0.1.0"
description = "FastAPI + LangGraph runtime for Precision Observer agents"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_api = ["rules/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
